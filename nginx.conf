server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en cabeceras ni páginas de error
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS: solo tiene efecto cuando el sitio se sirve por HTTPS (p. ej. detrás de un reverse proxy con TLS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP estricta: sin scripts/estilos inline; solo se permiten Google Fonts (únicos recursos externos del sitio)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquear acceso a cualquier archivo/directorio oculto (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
